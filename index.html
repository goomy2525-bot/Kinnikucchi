<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>筋トレたまご</title>
<style>
:root{
  --cream:#f6f1e5;
  --ink:#242424;
  --muted:#6f6a63;
  --line:#ded5c7;
  --wall:#fff3cf;
  --floor:#d9b98f;
  --white:#fffdf8;
  --accent:#222;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#ece5d9;color:var(--ink);
}
button,input{font:inherit}
button{cursor:pointer}
.app{
  width:min(430px,100%);
  height:100dvh;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:var(--cream);
}
.screen{
  position:absolute;
  inset:0;
  display:none !important;
}
.screen.active{
  display:flex !important;
}

/* ONBOARDING */
#onboardingScreen{
  z-index:30;
  background:
    radial-gradient(circle at 50% 88%, rgba(255,255,255,.9) 0 18%, transparent 19%),
    linear-gradient(#fff8df,#f1eadc);
  padding:
    calc(env(safe-area-inset-top) + 20px)
    18px
    calc(env(safe-area-inset-bottom) + 18px);
  flex-direction:column;
}
.onboard-head{
  flex:0 0 auto;
}
.onboard-brand{
  font-size:14px;
  font-weight:900;
  letter-spacing:.08em;
  color:#777067;
}
.onboard-progress{
  margin-top:10px;
  height:7px;
  background:#e8e1d5;
  border-radius:999px;
  overflow:hidden;
}
.onboard-progress > div{
  height:100%;
  width:0;
  background:#222;
  border-radius:999px;
  transition:.25s;
}
.question-wrap{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.question-kicker{
  font-size:12px;
  color:#8b847b;
  font-weight:800;
  margin-bottom:8px;
}
.question-title{
  font-size:28px;
  line-height:1.25;
  font-weight:950;
  letter-spacing:-1px;
}
.question-desc{
  margin-top:10px;
  color:#6f6a63;
  font-size:13px;
  line-height:1.6;
}
.answer-area{
  margin-top:24px;
}
.choice-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.choice-grid.one{
  grid-template-columns:1fr;
}
.choice{
  border:1px solid #ded5c7;
  background:#fff;
  border-radius:18px;
  padding:15px 10px;
  font-size:14px;
  font-weight:850;
}
.choice.active{
  background:#222;
  color:#fff;
  border-color:#222;
}
.number-card{
  background:#fff;
  border:1px solid #ded5c7;
  border-radius:22px;
  padding:20px;
}
.number-line{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:8px;
}
.number-input{
  width:120px;
  border:0;
  border-bottom:3px solid #222;
  background:transparent;
  text-align:center;
  font-size:42px;
  font-weight:950;
  outline:none;
}
.number-unit{
  font-size:16px;
  font-weight:800;
  padding-bottom:7px;
}
.inline-note{
  margin-top:12px;
  text-align:center;
  color:#8a8379;
  font-size:12px;
}
.onboard-actions{
  flex:0 0 auto;
  display:flex;
  gap:10px;
}
.secondary-btn,.primary-btn{
  border-radius:18px;
  padding:16px 14px;
  font-weight:900;
}
.secondary-btn{
  width:42%;
  background:#fff;
  border:1px solid #ded5c7;
  color:#444;
}
.primary-btn{
  flex:1;
  border:0;
  background:#222;
  color:#fff;
}
.primary-btn:disabled{
  opacity:.35;
}
.result-card{
  background:#fff;
  border:1px solid #ded5c7;
  border-radius:24px;
  padding:18px;
  margin-top:22px;
}
.result-title{
  font-size:16px;
  font-weight:950;
  margin-bottom:12px;
}
.result-row{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid #eee8dd;
  font-size:13px;
}
.result-row:last-child{border-bottom:0}
.egg-receive{
  width:138px;
  height:166px;
  margin:18px auto 4px;
  background:#fff9df;
  border:5px solid #292929;
  border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  animation:bob 2.6s ease-in-out infinite;
  filter:drop-shadow(0 10px 5px rgba(0,0,0,.1));
}

/* HOME */
#homeScreen{
  flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
.top-ui{
  flex:0 0 auto;
  padding:16px 16px 12px;
  background:rgba(246,241,229,.96);
  z-index:5;
}
.date-row{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:12px;
}
.date-main{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1}
.weekday{font-size:12px;color:var(--muted);font-weight:800;margin-top:6px}
.level{
  padding:7px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:13px;font-weight:900;
}
.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.profile-button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  font-weight:900;
}
.record-button{
  width:100%;border:0;border-radius:17px;background:#222;color:#fff;
  padding:15px 14px;font-size:16px;font-weight:900;
}
.today-summary{text-align:center;color:var(--muted);font-size:11px;margin-top:8px;height:16px}

/* ROOM */
.room{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  background:var(--wall);
}
.wall{
  position:absolute;left:0;right:0;top:0;height:64%;
  background:
    linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.2)),
    var(--wall);
}
.wall::after{
  content:"";
  position:absolute;left:0;right:0;bottom:0;height:8px;
  background:#d5a875;
}
.floor{
  position:absolute;left:0;right:0;bottom:0;height:37%;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 2px,transparent 2px 56px),
    linear-gradient(#dfbf96,#d0aa7e);
}
.window{
  position:absolute;top:8%;left:8%;
  width:100px;height:100px;border:7px solid #b47d4e;
  border-radius:8px;background:linear-gradient(#aee0ff 0 70%,#d4efaf 70%);
  box-shadow:0 4px 0 rgba(0,0,0,.08);
}
.window::before,.window::after{content:"";position:absolute;background:#b47d4e}
.window::before{width:6px;height:100%;left:50%;top:0;transform:translateX(-50%)}
.window::after{height:6px;width:100%;top:50%;left:0;transform:translateY(-50%)}
.curtain{
  position:absolute;top:6%;left:4%;
  width:116px;height:24px;border-radius:8px;background:#f0a8a8;
}
.poster{
  position:absolute;top:11%;right:8%;
  width:78px;height:92px;background:#fff;border:4px solid #a16f43;
  border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:30px;transform:rotate(2deg);
}
.shelf{
  position:absolute;right:7%;bottom:20%;
  width:94px;height:82px;background:#c99463;border:5px solid #9f6d43;
  border-radius:5px;
}
.shelf::before{
  content:"";position:absolute;left:0;right:0;top:34px;height:5px;background:#9f6d43;
}
.dumbbell{
  position:absolute;right:16%;bottom:17%;
  font-size:33px;transform:rotate(-7deg);
}
.rug{
  position:absolute;left:50%;bottom:7%;
  width:240px;height:92px;transform:translateX(-50%);
  background:#efe6d8;border-radius:50%;
  border:3px dashed rgba(0,0,0,.12);
}
.pet-zone{
  position:absolute;left:50%;bottom:9%;
  transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;
  width:220px;
}
.speech{
  position:relative;
  background:#fff;border:2px solid #2b2b2b;border-radius:15px;
  padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:12px;
  box-shadow:0 4px 0 rgba(0,0,0,.08);
}
.speech::after{
  content:"";position:absolute;left:50%;bottom:-8px;
  width:13px;height:13px;background:#fff;border-right:2px solid #2b2b2b;border-bottom:2px solid #2b2b2b;
  transform:translateX(-50%) rotate(45deg);
}
.egg{
  width:132px;height:157px;background:#fff9df;border:5px solid #292929;
  border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;
  display:flex;align-items:center;justify-content:center;
  font-size:47px;position:relative;transition:.18s;
  filter:drop-shadow(0 9px 4px rgba(0,0,0,.12));
  animation:bob 2.6s ease-in-out infinite;
}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-5px) rotate(1deg)}
}
.egg.pop{animation:none;transform:scale(1.1) rotate(-4deg)}
.egg.cracked::before{
  content:"";position:absolute;width:54px;height:30px;top:28px;left:50%;
  transform:translateX(-50%) rotate(-12deg);border-top:5px solid #292929;
  clip-path:polygon(0 45%,25% 0,45% 55%,70% 5%,100% 55%,100% 78%,0 78%);
}
.pet-name{
  margin-top:9px;padding:5px 10px;background:rgba(255,255,255,.8);
  border-radius:999px;font-size:14px;font-weight:900;
}
.exp-wrap{width:170px;margin-top:7px}
.bar{height:8px;background:rgba(255,255,255,.8);border-radius:999px;overflow:hidden;border:1px solid rgba(0,0,0,.1)}
.bar div{height:100%;background:#222;width:0;transition:.25s}
.exp-row{display:flex;justify-content:space-between;font-size:10px;color:#5c564f;margin-top:3px;font-weight:700}


/* PROFILE */
#profileScreen{
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px);
  display:flex;
  flex-direction:column;
  background:var(--cream);
}
.profile-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}
.profile-title{
  font-size:20px;
  font-weight:950;
}
.profile-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px;
}
.profile-type{
  text-align:center;
  padding:10px 0 16px;
  border-bottom:1px solid #eee8dd;
}
.profile-type-label{
  font-size:11px;
  color:var(--muted);
  font-weight:800;
}
.profile-type-value{
  margin-top:4px;
  font-size:23px;
  font-weight:950;
}
.profile-row{
  display:flex;
  justify-content:space-between;
  gap:18px;
  padding:11px 0;
  border-bottom:1px solid #eee8dd;
  font-size:13px;
}
.profile-row:last-child{border-bottom:0}
.profile-row span:first-child{
  color:var(--muted);
  font-weight:700;
}
.profile-row strong{
  text-align:right;
}
.profile-note{
  margin-top:12px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}
.rediagnose{
  margin-top:auto;
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  color:#222;
  border-radius:18px;
  padding:16px;
  font-size:14px;
  font-weight:900;
}

/* TRAINING */
#trainingScreen{
  padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px);
  flex-direction:column;
  background:var(--cream);
  overflow:hidden;
}
.training-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  flex:0 0 auto;
}
.back-button{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;
  font-size:22px;font-weight:800;
}
.training-title{font-size:18px;font-weight:950}
.head-space{width:42px}

.training-body{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.exercise-picker{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:13px;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}
.exercise-search{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  background:#f8f6f0;
  padding:11px 12px;
  font-size:14px;
  outline:none;
}
.category-scroll{
  display:flex;
  flex:0 0 44px;
  min-height:44px;
  align-items:center;
  gap:7px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:6px 0;
  margin:2px 0 4px;
  scrollbar-width:none;
  background:#fff;
  position:relative;
  z-index:2;
}
.category-scroll::-webkit-scrollbar{display:none}
.category-chip{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:7px 11px;
  font-size:11px;
  font-weight:850;
}
.category-chip.active{
  background:#222;
  color:#fff;
  border-color:#222;
}
.exercise-list{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  border-top:1px solid #eee8dd;
  position:relative;
  z-index:1;
  padding-top:2px;
}
.exercise-item{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:0;
  border-bottom:1px solid #eee8dd;
  background:#fff;
  padding:11px 4px;
  text-align:left;
}
.exercise-item.active .exercise-name{font-weight:950}
.exercise-item.active .exercise-radio{background:#222}
.exercise-main{min-width:0}
.exercise-name{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.exercise-meta{
  margin-top:3px;
  font-size:10px;
  color:var(--muted);
}
.exercise-radio{
  width:17px;height:17px;border:2px solid #222;border-radius:50%;
  flex:0 0 auto;
  box-shadow:inset 0 0 0 3px #fff;
}

.selected-exercise{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:12px 13px;
  flex:0 0 auto;
}
.selected-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.selected-name{
  font-size:15px;
  font-weight:950;
}
.muscle-tags{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:7px;
}
.muscle-tag{
  background:#f1eee7;
  border-radius:999px;
  padding:5px 7px;
  font-size:9px;
  font-weight:850;
}
.muscle-tag.primary{background:#222;color:#fff}

.input-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.metric-box{
  background:#f8f6f0;
  border:1px solid #ebe5da;
  border-radius:15px;
  padding:9px 7px;
  text-align:center;
}
.metric-label{
  font-size:9px;
  color:var(--muted);
  font-weight:850;
  margin-bottom:4px;
}
.metric-input{
  width:100%;
  border:0;
  background:transparent;
  text-align:center;
  outline:none;
  font-size:23px;
  font-weight:950;
  color:#222;
}
.metric-unit{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}
.bodyweight-note{
  font-size:9px;
  color:var(--muted);
  margin-top:7px;
}
.stimulus-preview{
  margin-top:9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:10px;
  color:var(--muted);
}
.stimulus-preview strong{
  color:#222;
  font-size:12px;
}


.previous-workout{
  margin-top:9px;
  padding:10px 11px;
  border:1px solid #ebe5da;
  background:#faf8f3;
  border-radius:14px;
}
.previous-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.previous-title{
  font-size:10px;
  color:var(--muted);
  font-weight:900;
}
.copy-previous{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:5px 8px;
  font-size:9px;
  font-weight:900;
}
.previous-sets{
  margin-top:7px;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:1px;
}
.previous-sets::-webkit-scrollbar{display:none}
.previous-set-chip{
  flex:0 0 auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 9px;
  font-size:10px;
  font-weight:850;
  white-space:nowrap;
}
.previous-empty{
  margin-top:7px;
  font-size:10px;
  color:var(--muted);
}

.set-editor{
  margin-top:10px;
}
.set-editor-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
  font-size:11px;
  color:var(--muted);
  font-weight:850;
}
.add-set-button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:7px 10px;
  font-size:11px;
  font-weight:900;
}
.set-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:210px;
  overflow-y:auto;
  padding-right:2px;
}
.set-row{
  display:grid;
  grid-template-columns:32px 1fr 1fr 38px;
  align-items:center;
  gap:7px;
  background:#f8f6f0;
  border:1px solid #ebe5da;
  border-radius:15px;
  padding:8px;
}
.set-number{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#222;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:950;
}
.set-field{
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
}
.set-field input{
  width:100%;
  min-width:0;
  border:0;
  background:#fff;
  border-radius:10px;
  padding:9px 6px;
  text-align:center;
  outline:none;
  font-size:18px;
  font-weight:950;
}
.set-unit{
  font-size:9px;
  color:var(--muted);
  font-weight:800;
  white-space:nowrap;
}
.remove-set{
  width:34px;
  height:34px;
  border:0;
  background:#fff;
  border-radius:10px;
  font-size:18px;
  color:#777;
}
.quick-copy{
  margin-top:6px;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.quick-copy::-webkit-scrollbar{display:none}
.quick-chip{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:6px 9px;
  font-size:10px;
  font-weight:850;
}

.save{
  flex:0 0 auto;
  width:100%;
  border:0;
  border-radius:18px;
  background:#222;
  color:#fff;
  padding:15px;
  font-size:15px;
  font-weight:950;
}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translateX(-50%) translateY(80px);
  background:#222;color:white;border-radius:999px;padding:11px 17px;
  font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:40;white-space:normal;
  width:min(88vw,380px);text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-height:700px){
  .question-title{font-size:24px}
  .top-ui{padding-top:10px}
  .date-main{font-size:24px}
  .record-button{padding:13px}
  .window{width:84px;height:84px}
  .curtain{width:100px}
  .poster{width:66px;height:78px}
  .egg{width:112px;height:134px;font-size:40px}
  .pet-zone{bottom:6%}
}
</style>
</head>
<body>
<main class="app">

<section class="screen active" id="onboardingScreen">
  <div class="onboard-head">
    <div class="onboard-brand">KINTAMA / PERSONAL SETUP</div>
    <div class="onboard-progress"><div id="onboardProgress"></div></div>
  </div>

  <div class="question-wrap" id="questionWrap">
    <div class="question-kicker">STEP 1</div>
    <div class="question-title">体重を教えて</div>

const GROWTH_KEYS=Object.keys(MUSCLE_LABELS);
GROWTH_KEYS.forEach(key=>{
  if(data.growth[key]===undefined) data.growth[key]=0;
});

function getExercise(id){
  return EXERCISES.find(ex=>ex.id===id) || EXERCISES[0];
}

function topMuscles(ex){
  return Object.entries(ex.m)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5);
}

function repsFactor(reps){
  if(reps<=5) return .90;
  if(reps<=12) return 1.00;
  if(reps<=20) return .85;
  if(reps<=30) return .65;
  return .45;
}

function calculateStimulus(ex,weight,reps,sets){
  const bodyWeight=(data.profile && data.profile.weight) ? Number(data.profile.weight) : 60;
  let effectiveWeight=Number(weight)||0;

  if(ex.bodyweight){
    effectiveWeight=(bodyWeight*ex.loadScale)+effectiveWeight;
  }

  const expected=Math.max(1,bodyWeight*ex.loadScale);
  const relativeLoad=Math.max(.45,Math.min(1.55,effectiveWeight/expected));
  const effortBase=sets*repsFactor(reps)*(0.65+relativeLoad*0.55)*10;

  const musclePoints={};
  Object.entries(ex.m).forEach(([muscle,coef])=>{
    musclePoints[muscle]=Number((effortBase*(coef/100)).toFixed(2));
  });

  return {
    total:Number(effortBase.toFixed(2)),
    musclePoints
  };
}

function renderCategories(){
  const cats=["すべて","胸","背中","肩","腕","脚","体幹"];

function renderExerciseList(){
  const q=(exerciseSearch.value||"").trim().toLowerCase();

  const filtered=EXERCISES.filter(ex=>{
    const categoryOk=selectedCategory==="すべて" || ex.cat===selectedCategory;
    const searchOk=!q || ex.name.toLowerCase().includes(q);
    return categoryOk && searchOk;
  });

  exerciseList.innerHTML=filtered.map(ex=>{
    const tops=topMuscles(ex).slice(0,3).map(x=>MUSCLE_LABELS[x[0]]).join("・");
    return `
      <button class="exercise-item ${selectedExerciseId===ex.id?"active":""}" data-id="${ex.id}">
        <div class="exercise-main">
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-meta">${tops}</div>
        </div>
        <div class="exercise-radio"></div>
      </button>
    `;
  }).join("");

  exerciseList.querySelectorAll(".exercise-item").forEach(btn=>{
    btn.addEventListener("click",()=>{
      selectedExerciseId=btn.dataset.id;
      const ex=getExercise(selectedExerciseId);

      if(ex.bodyweight){
        workoutSets=workoutSets.map(s=>({weight:0,reps:s.reps||10}));
      }else if(workoutSets.every(s=>Number(s.weight)===0)){
        workoutSets=workoutSets.map(s=>({weight:20,reps:s.reps||10}));
      }

      renderExerciseList();
      renderSelectedExercise();
    });
  });
}


function normalizeHistorySets(item){
  if(!item) return [];

  if(Array.isArray(item.sets)){
    return item.sets.map(set=>({
      weight:Number(set.weight)||0,
      reps:Number(set.reps)||1
    }));
  }

  // 古い記録形式との互換
  const count=Number(item.sets)||Number(item.setCount)||1;
  const weight=Number(item.weight)||0;
  const reps=Number(item.reps)||1;
  return Array.from({length:count},()=>({weight,reps}));
}

function getPreviousExerciseRecord(){
  return data.history.find(item=>{
    if(item.exerciseId) return item.exerciseId===selectedExerciseId;
    return item.name===getExercise(selectedExerciseId).name;
  }) || null;
}

function renderPreviousWorkout(){
  const previous=getPreviousExerciseRecord();
  const sets=normalizeHistorySets(previous);

  if(!previous || sets.length===0){
    previousSets.innerHTML='<div class="previous-empty">まだ前回記録がないよ</div>';
    copyPrevious.disabled=true;
    copyPrevious.style.opacity=".4";
    return;
  }

  copyPrevious.disabled=false;
  copyPrevious.style.opacity="1";

  previousSets.innerHTML=sets.map((set,index)=>`
    <button class="previous-set-chip" type="button" data-prev-index="${index}">
      ${index+1}set&nbsp; ${set.weight}kg × ${set.reps}
    </button>
  `).join("");

  // 個別の前回セットをタップしたら現在の末尾に追加
  previousSets.querySelectorAll(".previous-set-chip").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const set=sets[Number(btn.dataset.prevIndex)];
      workoutSets.push({weight:set.weight,reps:set.reps});
      renderSetList();
      updateStimulusPreview();
      requestAnimationFrame(()=>{ setList.scrollTop=setList.scrollHeight; });
    });
  });
}

function renderSetList(){
  setList.innerHTML=workoutSets.map((set,index)=>`
    <div class="set-row" data-index="${index}">
      <div class="set-number">${index+1}</div>

      <div class="set-field">
        <input
          class="set-weight"
          type="number"
          inputmode="decimal"
          min="0"
          step="0.5"
          value="${set.weight}"
          aria-label="${index+1}セット目の重量"
        />
        <span class="set-unit">kg</span>
      </div>

      <div class="set-field">
        <input
          class="set-reps"
          type="number"
          inputmode="numeric"
          min="1"
          max="200"
          value="${set.reps}"
          aria-label="${index+1}セット目の回数"
        />
        <span class="set-unit">回</span>
      </div>

      <button class="remove-set" data-remove="${index}" ${workoutSets.length===1?"disabled":""}>×</button>
    </div>
  `).join("");

  setList.querySelectorAll(".set-row").forEach(row=>{
    const index=Number(row.dataset.index);
    const w=row.querySelector(".set-weight");
    const r=row.querySelector(".set-reps");

    w.addEventListener("input",()=>{
      workoutSets[index].weight=Math.max(0,Number(w.value)||0);
      updateStimulusPreview();
    });
    r.addEventListener("input",()=>{
      workoutSets[index].reps=Math.max(1,Number(r.value)||1);
      updateStimulusPreview();
    });
  });

  setList.querySelectorAll(".remove-set").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const index=Number(btn.dataset.remove);
      if(workoutSets.length<=1) return;
      workoutSets.splice(index,1);
      renderSetList();
      updateStimulusPreview();
    });
  });
}

function addSet(){
  const last=workoutSets[workoutSets.length-1] || {weight:20,reps:10};
  workoutSets.push({
    weight:last.weight,
    reps:last.reps
  });
  renderSetList();
  updateStimulusPreview();

  requestAnimationFrame(()=>{
    setList.scrollTop=setList.scrollHeight;
    const rows=setList.querySelectorAll(".set-row");
    const lastRow=rows[rows.length-1];
    if(lastRow){
      const repsInput=lastRow.querySelector(".set-reps");
      if(repsInput){
        repsInput.focus();
        repsInput.select();
      }
    }
  });
}

function renderSelectedExercise(){
  const ex=getExercise(selectedExerciseId);
  selectedExerciseName.textContent=ex.name;

  const tops=topMuscles(ex);
  muscleTags.innerHTML=tops.map((item,index)=>{
    const label=MUSCLE_LABELS[item[0]];
    const coef=item[1];
    return `<span class="muscle-tag ${index===0?"primary":""}">${label} ${coef}%</span>`;
  }).join("");

  bodyweightNote.textContent=ex.bodyweight
    ? "自重種目：追加負荷がある時だけkgを入力。追加負荷なしなら0kg"
    : "セットごとに実際に扱った重量と回数を入力";

  if(ex.bodyweight){
    workoutSets=workoutSets.map(s=>({weight:0,reps:s.reps||10}));
  }else if(workoutSets.every(s=>Number(s.weight)===0)){
    workoutSets=workoutSets.map(s=>({weight:20,reps:s.reps||10}));
  }

  renderPreviousWorkout();
  renderSetList();
  updateStimulusPreview();
}

function updateStimulusPreview(){
  const ex=getExercise(selectedExerciseId);
  let total=0;

  workoutSets.forEach(set=>{
    const result=calculateStimulus(
      ex,
      Math.max(0,Number(set.weight)||0),
      Math.max(1,Number(set.reps)||1),
      1
    );
    total+=result.total;
  });

  stimulusPreview.textContent=total.toFixed(1)+" pt";
}

function initTrainingUI(){
  renderCategories();
  renderExerciseList();
  renderSelectedExercise();
}

    kicker:"STEP 4",
    title:"主にどこで鍛える？",
    desc:"自重中心か、フリーウェイトを使えるかで基準を少し変える。",
    type:"choice",
    options:[
      ["home","自宅メイン"],
      ["gym","ジムメイン"],
      ["both","両方"]
    ]
  },
  {
    key:"bench",
    kicker:"STEP 5",
    title:"ベンチプレスは何kgくらい？",
    desc:"分からない・やったことない場合は 0 のままでOK。",
    type:"number",
    unit:"kg",
    min:0,max:250,
    placeholder:"0"
  },
  {
    key:"squat",
    kicker:"STEP 6",
    title:"スクワットは何kgくらい？",
    desc:"バーベルスクワットの目安。分からなければ 0 でOK。",
    type:"number",
    unit:"kg",
    min:0,max:350,
    placeholder:"0"
  },
  {
    key:"press",
    kicker:"STEP 7",
    title:"ショルダープレスは何kgくらい？",
    desc:"ダンベルなら両手合計の重量でざっくり入れてOK。",
    type:"number",
    unit:"kg",
    min:0,max:180,
    placeholder:"0"
  },
  {
    key:"result",
    kicker:"READY",
    title:"あなた用の負荷基準を作ったよ",
    desc:"この基準を使って、同じトレーニングでも人ごとに成長量を変えていく。",
    type:"result"
  }
];

function experienceFactor(v){
  if(v==="none") return 0.85;
  if(v==="short") return 1.0;
  if(v==="mid") return 1.15;
  return 1.3;
}

function environmentFactor(v){
  if(v==="home") return 0.95;
  if(v==="gym") return 1.08;
  return 1.0;
}

function frequencyFactor(v){
  const n=Number(v||1);
  return 0.9 + Math.min(n,4)*0.05;
}

function calculateProfile(){
  const weight=Math.max(30,Number(answers.weight)||60);
  const bench=Number(answers.bench)||0;
  const squat=Number(answers.squat)||0;
  const press=Number(answers.press)||0;

  const strengthIndex =
    ((bench/weight)*0.4) +
    ((squat/weight)*0.4) +
    ((press/weight)*0.2);

  const expF=experienceFactor(answers.experience);
  const envF=environmentFactor(answers.environment);
  const freqF=frequencyFactor(answers.frequency);

  const baselineMultiplier = Math.max(
    0.75,
    Math.min(1.55, 0.95 + strengthIndex*0.22 + (expF-1)*0.35)
  );

  let levelLabel="ビギナー";
  if(baselineMultiplier>=1.25) levelLabel="ハードトレーニー";
  else if(baselineMultiplier>=1.08) levelLabel="中級トレーニー";

  return {
    weight,
    experience:answers.experience,
    weeklyFrequency:Number(answers.frequency||1),
    environment:answers.environment,
    referenceLifts:{bench,squat,press},
    strengthIndex:Number(strengthIndex.toFixed(3)),
    baselineMultiplier:Number(baselineMultiplier.toFixed(3)),
    recoveryFactor:Number(freqF.toFixed(3)),
    environmentFactor:Number(envF.toFixed(3)),
    levelLabel,
    createdAt:new Date().toISOString()
  };
}

function renderQuestion(){
  const q=questions[step];
  onboardProgress.style.width=((step+1)/questions.length*100)+"%";
  backQuestion.style.visibility=step===0||q.type==="result"?"hidden":"visible";
  nextQuestion.textContent=q.type==="result"?"卵を受け取る":"次へ";

  let html=`
    <div class="question-kicker">${q.kicker}</div>
    <div class="question-title">${q.title}</div>
    <div class="question-desc">${q.desc}</div>
    <div class="answer-area">
  `;

  if(q.type==="number"){
    html+=`
      <div class="number-card">
        <div class="number-line">
          <input
            class="number-input"
            id="numberAnswer"
            type="number"
            inputmode="decimal"
            min="${q.min}"
            max="${q.max}"
            placeholder="${q.placeholder}"
            value="${answers[q.key] || ""}"
          />
          <div class="number-unit">${q.unit}</div>
        </div>
        <div class="inline-note">ざっくりで大丈夫</div>
      </div>
    `;
  }

  if(q.type==="choice"){
    html+=`<div class="choice-grid ${q.options.length===3?'one':''}">`;
    q.options.forEach(([value,label])=>{
      const active=answers[q.key]===value?"active":"";
      html+=`<button class="choice ${active}" data-value="${value}">${label}</button>`;
    });
    html+=`</div>`;
  }

  if(q.type==="result"){
    const p=calculateProfile();
    html+=`
      <div class="result-card">
        <div class="result-title">診断結果</div>
        <div class="result-row"><span>タイプ</span><strong>${p.levelLabel}</strong></div>
        <div class="result-row"><span>基準倍率</span><strong>${p.baselineMultiplier}</strong></div>
        <div class="result-row"><span>週トレ頻度</span><strong>${p.weeklyFrequency}回</strong></div>
        <div class="result-row"><span>環境</span><strong>${environmentLabel(p.environment)}</strong></div>
      </div>
      <div class="egg-receive">🥚</div>
      <div class="inline-note">この卵が、あなたの記録で育っていく。</div>
    `;
  }

  html+=`</div>`;
  questionWrap.innerHTML=html;

  if(q.type==="number"){
    const input=document.getElementById("numberAnswer");
    input.addEventListener("input",()=>{
      answers[q.key]=input.value;
      updateNextState();
    });
  }

  if(q.type==="choice"){
    questionWrap.querySelectorAll(".choice").forEach(btn=>{
      btn.addEventListener("click",()=>{
        answers[q.key]=btn.dataset.value;
        renderQuestion();
      });
    });
  }

  updateNextState();
}

function environmentLabel(v){
  if(v==="home") return "自宅";
  if(v==="gym") return "ジム";
  return "自宅＋ジム";
}

function experienceLabel(v){
  if(v==="none") return "ほぼ未経験";
  if(v==="short") return "〜6か月";
  if(v==="mid") return "6か月〜2年";
  if(v==="long") return "2年以上";
  return "未設定";
}

function renderProfile(){
  const p=data.profile;
  if(!p){
    profileCard.innerHTML='<div class="inline-note">診断データがまだないよ。</div>';
    return;
  }

  profileCard.innerHTML=`
    <div class="profile-type">
      <div class="profile-type-label">現在の判定タイプ</div>
      <div class="profile-type-value">${p.levelLabel || "ビギナー"}</div>
    </div>

    <div class="profile-row"><span>体重</span><strong>${(p.weight!==undefined && p.weight!==null)?p.weight:"-"} kg</strong></div>
    <div class="profile-row"><span>筋トレ歴</span><strong>${experienceLabel(p.experience)}</strong></div>
    <div class="profile-row"><span>週トレ頻度</span><strong>${(p.weeklyFrequency!==undefined && p.weeklyFrequency!==null)?p.weeklyFrequency:"-"}回</strong></div>
    <div class="profile-row"><span>環境</span><strong>${environmentLabel(p.environment)}</strong></div>
    <div class="profile-row"><span>ベンチプレス</span><strong>${(p.referenceLifts && p.referenceLifts.bench!==undefined)?p.referenceLifts.bench:0} kg</strong></div>
    <div class="profile-row"><span>スクワット</span><strong>${(p.referenceLifts && p.referenceLifts.squat!==undefined)?p.referenceLifts.squat:0} kg</strong></div>
    <div class="profile-row"><span>ショルダープレス</span><strong>${(p.referenceLifts && p.referenceLifts.press!==undefined)?p.referenceLifts.press:0} kg</strong></div>
    <div class="profile-row"><span>基準倍率</span><strong>${(p.baselineMultiplier!==undefined && p.baselineMultiplier!==null)?p.baselineMultiplier:1}</strong></div>
  `;
}


function updateNextState(){
  const q=questions[step];
  if(q.type==="result"){
    nextQuestion.disabled=false;
    return;
  }
  if(q.type==="number"){
    nextQuestion.disabled=false;
    return;
  }
  nextQuestion.disabled=!answers[q.key];
}

nextQuestion.addEventListener("click",()=>{
  const q=questions[step];

  if(q.type==="number"){
    // iPhone/Safariで静的フォールバック表示になった場合も含め、
    // 現在画面に見えている数値入力欄から直接値を取得する。
    const input=questionWrap.querySelector('input[type="number"]');
    if(input){
      answers[q.key]=String(input.value).trim();
    }

    if(q.key==="weight"){
      const weightValue=parseFloat(answers[q.key]);
      if(Number.isNaN(weightValue) || weightValue<30 || weightValue>200){
        showToast("体重を30〜200kgで入力してね");
        return;
      }
      answers[q.key]=String(weightValue);
    }
  }

  if(q.type==="result"){
    data.profile=calculateProfile();
    data.setupComplete=true;
    saveData();

    render();
    showScreen("home");
    showToast("たまごを受け取った！");
    return;
  }

  step++;
  renderQuestion();
});

backQuestion.addEventListener("click",()=>{
  if(step>0){
    step--;
    renderQuestion();
  }
});

function startOnboardingIfNeeded(){
  if(!data.setupComplete){
    step=0;
    renderQuestion();
    showScreen("onboarding");
  }else{
    showScreen("home");
  }
}

/* ---------- APP ---------- */
function renderDate(){
  const now=new Date();
  const days=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
  document.getElementById("dateMain").textContent=(now.getMonth()+1)+"月"+now.getDate()+"日";
  document.getElementById("weekday").textContent=days[now.getDay()];
}
function levelInfo(){
  return {level:Math.floor(data.exp/100)+1,current:data.exp%100};
}
function evolve(level){
  egg.classList.remove("cracked");
  if(level>=5){
    egg.textContent="🐣";
    petName.textContent="ムキムキひよこ";
    statusText.textContent="まだまだいけるぞ！";
    egg.classList.add("cracked");
  }else if(level>=3){
    egg.textContent="🥚";
    petName.textContent="割れかけたまご";
    statusText.textContent="中で暴れてる…";
    egg.classList.add("cracked");
  }else if(level>=2){
    egg.textContent="🥚";
    petName.textContent="元気なたまご";
    statusText.textContent="ちょっと動きたい。";
  }else{
    egg.textContent="🥚";
    petName.textContent="たまご";
    statusText.textContent="今日はどうする？";
  }
}
function renderToday(){
  const today=new Date().toDateString();
  const logs=data.history.filter(x=>new Date(x.date).toDateString()===today);
  if(logs.length===0){
    todaySummary.textContent="今日はまだトレーニングしてない";
  }else{
    const totalSets=logs.reduce((s,x)=>{
      if(Array.isArray(x.sets)) return s+x.sets.length;
      if(x.setCount) return s+Number(x.setCount);
      return s+(Number(x.sets)||1);
    },0);
    const totalReps=logs.reduce((s,x)=>{
      if(Array.isArray(x.sets)){
        return s+x.sets.reduce((a,set)=>a+(Number(set.reps)||0),0);
      }
      return s+(Number(x.reps)||0)*(Number(x.sets)||1);
    },0);
    todaySummary.textContent="今日 "+logs.length+"種目 / "+totalSets+"セット / "+totalReps+"回";
  }
}
function render(){
  renderDate();
  const info=levelInfo();
  levelText.textContent="Lv."+info.level;
  expText.textContent=info.current+" / 100";
  expBar.style.width=info.current+"%";
  evolve(info.level);
  renderToday();
}
function openTraining(){
  initTrainingUI();
  showScreen("training");
}
function backHome(){
  render();
  showScreen("home");
}

function openProfile(){
  renderProfile();
  showScreen("profile");
}

function closeProfile(){
  render();
  showScreen("home");
}
function showToast(text){
  toast.textContent=text;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1400);
}

document.getElementById("openTraining").addEventListener("click",openTraining);
document.getElementById("backHome").addEventListener("click",backHome);
document.getElementById("openProfile").addEventListener("click",openProfile);
document.getElementById("backProfile").addEventListener("click",closeProfile);

document.getElementById("rediagnose").addEventListener("click",()=>{
  if(!confirm("診断を最初からやり直す？\n今までのトレーニング記録は残るよ。")) return;

  data.setupComplete=false;
  data.profile=null;
  saveData();

  answers={
    weight:"",
    experience:"",
    frequency:"",
    environment:"",
    bench:"",
    squat:"",
    press:""
  };
  step=0;
  renderQuestion();
  showScreen("onboarding");
});

exerciseSearch.addEventListener("input",renderExerciseList);
addSetButton.addEventListener("click",addSet);
copyPrevious.addEventListener("click",()=>{
  const previous=getPreviousExerciseRecord();
  const sets=normalizeHistorySets(previous);
  if(sets.length===0){
    showToast("前回記録がまだないよ");
    return;
  }

  workoutSets=sets.map(set=>({
    weight:set.weight,
    reps:set.reps
  }));

  renderSetList();
  updateStimulusPreview();
  showToast("前回のセットをコピーした！");
});

document.getElementById("save").addEventListener("click",()=>{
  const ex=getExercise(selectedExerciseId);

  if(workoutSets.length===0){
    showToast("セットを1つ以上入れてね");
    return;
  }

  if(!ex.bodyweight && workoutSets.some(s=>(Number(s.weight)||0)<=0)){
    showToast("重量を入力してね");
    return;
  }

  let totalStimulus=0;
  const totalMusclePoints={};

  workoutSets.forEach(set=>{
    const weight=Math.max(0,Number(set.weight)||0);
    const reps=Math.max(1,Number(set.reps)||1);
    const stimulus=calculateStimulus(ex,weight,reps,1);

    totalStimulus+=stimulus.total;

    Object.entries(stimulus.musclePoints).forEach(([muscle,points])=>{
      totalMusclePoints[muscle]=(totalMusclePoints[muscle]||0)+points;
    });
  });

  Object.entries(totalMusclePoints).forEach(([muscle,points])=>{
    if(data.growth[muscle]===undefined) data.growth[muscle]=0;
    data.growth[muscle]+=points;
  });

  const gained=Math.max(5,Math.round(totalStimulus));
  data.exp+=gained;

  const totalReps=workoutSets.reduce((sum,s)=>sum+(Number(s.reps)||0),0);

  data.history.unshift({
    exerciseId:ex.id,
    name:ex.name,
    sets:workoutSets.map(s=>({
      weight:Number(s.weight)||0,
      reps:Number(s.reps)||1
    })),
    setCount:workoutSets.length,
    reps:totalReps,
    exp:gained,
    stimulus:Number(totalStimulus.toFixed(2)),
    musclePoints:totalMusclePoints,
    date:new Date().toISOString()
  });

  data.history=data.history.slice(0,100);
  saveData();

  showToast(ex.name+" "+workoutSets.length+"セット記録！");
  render();

  // 記録後も画面に残る。次の種目へ移りやすいようセットは3つに戻し、
  // 直前の重量を引き継ぐ。
  const lastWeight=workoutSets[workoutSets.length-1].weight;
  workoutSets=[
    {weight:lastWeight,reps:10},
    {weight:lastWeight,reps:10},
    {weight:lastWeight,reps:10}
  ];
  renderPreviousWorkout();
  renderSetList();
  updateStimulusPreview();
});

startOnboardingIfNeeded();
render();
</script>
