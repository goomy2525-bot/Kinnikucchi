<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>筋トレたまご</title>
<style>
:root{
  --cream:#f6f1e5;
  --ink:#242424;
  --muted:#6f6a63;
  --line:#ded5c7;
  --wall:#fff3cf;
  --floor:#d9b98f;
  --white:#fffdf8;
  --accent:#222;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#ece5d9;color:var(--ink);
}
button,input{font:inherit}
button{cursor:pointer}
.app{
  width:min(430px,100%);
  height:100dvh;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:var(--cream);
}
.screen{
  position:absolute;inset:0;
  transition:.28s ease;
}
.screen.hidden-left{transform:translateX(-100%);opacity:0;pointer-events:none}
.screen.hidden-right{transform:translateX(100%);opacity:0;pointer-events:none}
.screen.hidden{display:none !important}

/* ONBOARDING */
#onboardingScreen{
  z-index:30;
  background:
    radial-gradient(circle at 50% 88%, rgba(255,255,255,.9) 0 18%, transparent 19%),
    linear-gradient(#fff8df,#f1eadc);
  padding:
    calc(env(safe-area-inset-top) + 20px)
    18px
    calc(env(safe-area-inset-bottom) + 18px);
  display:flex;
  flex-direction:column;
}
.onboard-head{
  flex:0 0 auto;
}
.onboard-brand{
  font-size:14px;
  font-weight:900;
  letter-spacing:.08em;
  color:#777067;
}
.onboard-progress{
  margin-top:10px;
  height:7px;
  background:#e8e1d5;
  border-radius:999px;
  overflow:hidden;
}
.onboard-progress > div{
  height:100%;
  width:0;
  background:#222;
  border-radius:999px;
  transition:.25s;
}
.question-wrap{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.question-kicker{
  font-size:12px;
  color:#8b847b;
  font-weight:800;
  margin-bottom:8px;
}
.question-title{
  font-size:28px;
  line-height:1.25;
  font-weight:950;
  letter-spacing:-1px;
}
.question-desc{
  margin-top:10px;
  color:#6f6a63;
  font-size:13px;
  line-height:1.6;
}
.answer-area{
  margin-top:24px;
}
.choice-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.choice-grid.one{
  grid-template-columns:1fr;
}
.choice{
  border:1px solid #ded5c7;
  background:#fff;
  border-radius:18px;
  padding:15px 10px;
  font-size:14px;
  font-weight:850;
}
.choice.active{
  background:#222;
  color:#fff;
  border-color:#222;
}
.number-card{
  background:#fff;
  border:1px solid #ded5c7;
  border-radius:22px;
  padding:20px;
}
.number-line{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:8px;
}
.number-input{
  width:120px;
  border:0;
  border-bottom:3px solid #222;
  background:transparent;
  text-align:center;
  font-size:42px;
  font-weight:950;
  outline:none;
}
.number-unit{
  font-size:16px;
  font-weight:800;
  padding-bottom:7px;
}
.inline-note{
  margin-top:12px;
  text-align:center;
  color:#8a8379;
  font-size:12px;
}
.onboard-actions{
  flex:0 0 auto;
  display:flex;
  gap:10px;
}
.secondary-btn,.primary-btn{
  border-radius:18px;
  padding:16px 14px;
  font-weight:900;
}
.secondary-btn{
  width:42%;
  background:#fff;
  border:1px solid #ded5c7;
  color:#444;
}
.primary-btn{
  flex:1;
  border:0;
  background:#222;
  color:#fff;
}
.primary-btn:disabled{
  opacity:.35;
}
.result-card{
  background:#fff;
  border:1px solid #ded5c7;
  border-radius:24px;
  padding:18px;
  margin-top:22px;
}
.result-title{
  font-size:16px;
  font-weight:950;
  margin-bottom:12px;
}
.result-row{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid #eee8dd;
  font-size:13px;
}
.result-row:last-child{border-bottom:0}
.egg-receive{
  width:138px;
  height:166px;
  margin:18px auto 4px;
  background:#fff9df;
  border:5px solid #292929;
  border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  animation:bob 2.6s ease-in-out infinite;
  filter:drop-shadow(0 10px 5px rgba(0,0,0,.1));
}

/* HOME */
#homeScreen{
  display:flex;
  flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
.top-ui{
  flex:0 0 auto;
  padding:16px 16px 12px;
  background:rgba(246,241,229,.96);
  z-index:5;
}
.date-row{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:12px;
}
.date-main{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1}
.weekday{font-size:12px;color:var(--muted);font-weight:800;margin-top:6px}
.level{
  padding:7px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:13px;font-weight:900;
}
.record-button{
  width:100%;border:0;border-radius:17px;background:#222;color:#fff;
  padding:15px 14px;font-size:16px;font-weight:900;
}
.today-summary{text-align:center;color:var(--muted);font-size:11px;margin-top:8px;height:16px}

/* ROOM */
.room{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  background:var(--wall);
}
.wall{
  position:absolute;left:0;right:0;top:0;height:64%;
  background:
    linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.2)),
    var(--wall);
}
.wall::after{
  content:"";
  position:absolute;left:0;right:0;bottom:0;height:8px;
  background:#d5a875;
}
.floor{
  position:absolute;left:0;right:0;bottom:0;height:37%;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 2px,transparent 2px 56px),
    linear-gradient(#dfbf96,#d0aa7e);
}
.window{
  position:absolute;top:8%;left:8%;
  width:100px;height:100px;border:7px solid #b47d4e;
  border-radius:8px;background:linear-gradient(#aee0ff 0 70%,#d4efaf 70%);
  box-shadow:0 4px 0 rgba(0,0,0,.08);
}
.window::before,.window::after{content:"";position:absolute;background:#b47d4e}
.window::before{width:6px;height:100%;left:50%;top:0;transform:translateX(-50%)}
.window::after{height:6px;width:100%;top:50%;left:0;transform:translateY(-50%)}
.curtain{
  position:absolute;top:6%;left:4%;
  width:116px;height:24px;border-radius:8px;background:#f0a8a8;
}
.poster{
  position:absolute;top:11%;right:8%;
  width:78px;height:92px;background:#fff;border:4px solid #a16f43;
  border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:30px;transform:rotate(2deg);
}
.shelf{
  position:absolute;right:7%;bottom:20%;
  width:94px;height:82px;background:#c99463;border:5px solid #9f6d43;
  border-radius:5px;
}
.shelf::before{
  content:"";position:absolute;left:0;right:0;top:34px;height:5px;background:#9f6d43;
}
.dumbbell{
  position:absolute;right:16%;bottom:17%;
  font-size:33px;transform:rotate(-7deg);
}
.rug{
  position:absolute;left:50%;bottom:7%;
  width:240px;height:92px;transform:translateX(-50%);
  background:#efe6d8;border-radius:50%;
  border:3px dashed rgba(0,0,0,.12);
}
.pet-zone{
  position:absolute;left:50%;bottom:9%;
  transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;
  width:220px;
}
.speech{
  position:relative;
  background:#fff;border:2px solid #2b2b2b;border-radius:15px;
  padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:12px;
  box-shadow:0 4px 0 rgba(0,0,0,.08);
}
.speech::after{
  content:"";position:absolute;left:50%;bottom:-8px;
  width:13px;height:13px;background:#fff;border-right:2px solid #2b2b2b;border-bottom:2px solid #2b2b2b;
  transform:translateX(-50%) rotate(45deg);
}
.egg{
  width:132px;height:157px;background:#fff9df;border:5px solid #292929;
  border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;
  display:flex;align-items:center;justify-content:center;
  font-size:47px;position:relative;transition:.18s;
  filter:drop-shadow(0 9px 4px rgba(0,0,0,.12));
  animation:bob 2.6s ease-in-out infinite;
}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-5px) rotate(1deg)}
}
.egg.pop{animation:none;transform:scale(1.1) rotate(-4deg)}
.egg.cracked::before{
  content:"";position:absolute;width:54px;height:30px;top:28px;left:50%;
  transform:translateX(-50%) rotate(-12deg);border-top:5px solid #292929;
  clip-path:polygon(0 45%,25% 0,45% 55%,70% 5%,100% 55%,100% 78%,0 78%);
}
.pet-name{
  margin-top:9px;padding:5px 10px;background:rgba(255,255,255,.8);
  border-radius:999px;font-size:14px;font-weight:900;
}
.exp-wrap{width:170px;margin-top:7px}
.bar{height:8px;background:rgba(255,255,255,.8);border-radius:999px;overflow:hidden;border:1px solid rgba(0,0,0,.1)}
.bar div{height:100%;background:#222;width:0;transition:.25s}
.exp-row{display:flex;justify-content:space-between;font-size:10px;color:#5c564f;margin-top:3px;font-weight:700}

/* TRAINING */
#trainingScreen{
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px);
  display:flex;flex-direction:column;background:var(--cream);
}
.training-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;
}
.back-button{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;
  font-size:22px;font-weight:800;
}
.training-title{font-size:19px;font-weight:900}
.head-space{width:42px}
.training-card{
  background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;
}
.label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:9px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{
  padding:15px 8px;border-radius:16px;border:1px solid var(--line);background:#fff;
  font-size:14px;font-weight:800;
}
.menu button.active{background:#222;color:white;border-color:#222}
.rep-area{margin-top:22px;text-align:center}
.counter{display:flex;justify-content:center;align-items:center;gap:25px;margin-top:8px}
.counter button{
  width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:27px;
}
.reps{min-width:72px;font-size:42px;font-weight:900;line-height:1}
.reps-unit{font-size:12px;color:var(--muted);margin-top:5px}
.save{
  margin-top:auto;width:100%;border:0;border-radius:20px;background:#222;color:#fff;
  padding:18px;font-size:16px;font-weight:900;
}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translateX(-50%) translateY(80px);
  background:#222;color:white;border-radius:999px;padding:11px 17px;
  font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-height:700px){
  .question-title{font-size:24px}
  .top-ui{padding-top:10px}
  .date-main{font-size:24px}
  .record-button{padding:13px}
  .window{width:84px;height:84px}
  .curtain{width:100px}
  .poster{width:66px;height:78px}
  .egg{width:112px;height:134px;font-size:40px}
  .pet-zone{bottom:6%}
}
</style>
</head>
<body>
<main class="app">

<section class="screen hidden" id="onboardingScreen">
  <div class="onboard-head">
    <div class="onboard-brand">KINTAMA / PERSONAL SETUP</div>
    <div class="onboard-progress"><div id="onboardProgress"></div></div>
  </div>

  <div class="question-wrap" id="questionWrap">
    <div class="question-kicker">STEP 1</div>
    <div class="question-title">体重を教えて</div>
    <div class="question-desc">負荷の強さを、あなた自身に対してどれくらいか判断するために使うよ。</div>
    <div class="answer-area">
      <div class="number-card">
        <div class="number-line">
          <input class="number-input" id="numberAnswerFallback" type="number" inputmode="decimal" min="30" max="200" placeholder="60" />
          <div class="number-unit">kg</div>
        </div>
        <div class="inline-note">ざっくりで大丈夫</div>
      </div>
    </div>
  </div>

  <div class="onboard-actions">
    <button class="secondary-btn" id="backQuestion">戻る</button>
    <button class="primary-btn" id="nextQuestion">次へ</button>
  </div>
</section>

<section class="screen" id="homeScreen">
  <div class="top-ui">
    <div class="date-row">
      <div>
        <div class="date-main" id="dateMain"></div>
        <div class="weekday" id="weekday"></div>
      </div>
      <div class="level" id="levelText">Lv.1</div>
    </div>
    <button class="record-button" id="openTraining">トレーニングを記録する</button>
    <div class="today-summary" id="todaySummary">今日はまだトレーニングしてない</div>
  </div>

  <div class="room">
    <div class="wall"></div>
    <div class="floor"></div>
    <div class="curtain"></div>
    <div class="window"></div>
    <div class="poster">💪</div>
    <div class="shelf"></div>
    <div class="dumbbell">🏋️</div>
    <div class="rug"></div>

    <div class="pet-zone">
      <div class="speech" id="statusText">今日はどうする？</div>
      <div class="egg" id="egg">🥚</div>
      <div class="pet-name" id="petName">たまご</div>
      <div class="exp-wrap">
        <div class="bar"><div id="expBar"></div></div>
        <div class="exp-row">
          <span>EXP</span>
          <span id="expText">0 / 100</span>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="screen hidden-right" id="trainingScreen">
  <div class="training-head">
    <button class="back-button" id="backHome">‹</button>
    <div class="training-title">トレーニング記録</div>
    <div class="head-space"></div>
  </div>

  <div class="training-card">
    <div class="label">種目</div>
    <div class="menu" id="menu">
      <button class="active" data-name="腕立て伏せ">腕立て伏せ</button>
      <button data-name="スクワット">スクワット</button>
      <button data-name="腹筋">腹筋</button>
      <button data-name="ダンベル">ダンベル</button>
    </div>

    <div class="rep-area">
      <div class="label">回数</div>
      <div class="counter">
        <button id="minus">−</button>
        <div>
          <div class="reps" id="reps">10</div>
          <div class="reps-unit">回</div>
        </div>
        <button id="plus">＋</button>
      </div>
    </div>
  </div>

  <button class="save" id="save">このトレーニングを記録</button>
</section>

</main>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY="kintoreTamagoDataV4";

let data=JSON.parse(localStorage.getItem(STORAGE_KEY))||{
  exp:0,
  history:[],
  setupComplete:false,
  profile:null,
  growth:{
    chest:0,
    back:0,
    shoulders:0,
    biceps:0,
    triceps:0,
    abs:0,
    quads:0,
    hamstrings:0,
    glutes:0,
    calves:0
  }
};

let selected="腕立て伏せ";
let reps=10;

const onboardingScreen=document.getElementById("onboardingScreen");
const homeScreen=document.getElementById("homeScreen");
const trainingScreen=document.getElementById("trainingScreen");
const questionWrap=document.getElementById("questionWrap");
const nextQuestion=document.getElementById("nextQuestion");
const backQuestion=document.getElementById("backQuestion");
const onboardProgress=document.getElementById("onboardProgress");
const levelText=document.getElementById("levelText");
const expBar=document.getElementById("expBar");
const expText=document.getElementById("expText");
const egg=document.getElementById("egg");
const petName=document.getElementById("petName");
const statusText=document.getElementById("statusText");
const todaySummary=document.getElementById("todaySummary");
const repsEl=document.getElementById("reps");
const toast=document.getElementById("toast");

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

/* ---------- ONBOARDING ---------- */
let step=0;
let answers={
  weight:"",
  experience:"",
  frequency:"",
  environment:"",
  bench:"",
  squat:"",
  press:""
};

const questions=[
  {
    key:"weight",
    kicker:"STEP 1",
    title:"体重を教えて",
    desc:"負荷の強さを、あなた自身に対してどれくらいか判断するために使うよ。",
    type:"number",
    unit:"kg",
    min:30,max:200,
    placeholder:"60"
  },
  {
    key:"experience",
    kicker:"STEP 2",
    title:"筋トレ歴はどれくらい？",
    desc:"同じ重量でも、初心者と経験者では負荷の意味が変わる。",
    type:"choice",
    options:[
      ["none","ほぼ未経験"],
      ["short","〜6か月"],
      ["mid","6か月〜2年"],
      ["long","2年以上"]
    ]
  },
  {
    key:"frequency",
    kicker:"STEP 3",
    title:"週に何回くらい鍛える？",
    desc:"継続頻度も成長速度の基準にするよ。",
    type:"choice",
    options:[
      ["1","週1"],
      ["2","週2"],
      ["3","週3"],
      ["4","週4以上"]
    ]
  },
  {
    key:"environment",
    kicker:"STEP 4",
    title:"主にどこで鍛える？",
    desc:"自重中心か、フリーウェイトを使えるかで基準を少し変える。",
    type:"choice",
    options:[
      ["home","自宅メイン"],
      ["gym","ジムメイン"],
      ["both","両方"]
    ]
  },
  {
    key:"bench",
    kicker:"STEP 5",
    title:"ベンチプレスは何kgくらい？",
    desc:"分からない・やったことない場合は 0 のままでOK。",
    type:"number",
    unit:"kg",
    min:0,max:250,
    placeholder:"0"
  },
  {
    key:"squat",
    kicker:"STEP 6",
    title:"スクワットは何kgくらい？",
    desc:"バーベルスクワットの目安。分からなければ 0 でOK。",
    type:"number",
    unit:"kg",
    min:0,max:350,
    placeholder:"0"
  },
  {
    key:"press",
    kicker:"STEP 7",
    title:"ショルダープレスは何kgくらい？",
    desc:"ダンベルなら両手合計の重量でざっくり入れてOK。",
    type:"number",
    unit:"kg",
    min:0,max:180,
    placeholder:"0"
  },
  {
    key:"result",
    kicker:"READY",
    title:"あなた用の負荷基準を作ったよ",
    desc:"この基準を使って、同じトレーニングでも人ごとに成長量を変えていく。",
    type:"result"
  }
];

function experienceFactor(v){
  if(v==="none") return 0.85;
  if(v==="short") return 1.0;
  if(v==="mid") return 1.15;
  return 1.3;
}

function environmentFactor(v){
  if(v==="home") return 0.95;
  if(v==="gym") return 1.08;
  return 1.0;
}

function frequencyFactor(v){
  const n=Number(v||1);
  return 0.9 + Math.min(n,4)*0.05;
}

function calculateProfile(){
  const weight=Math.max(30,Number(answers.weight)||60);
  const bench=Number(answers.bench)||0;
  const squat=Number(answers.squat)||0;
  const press=Number(answers.press)||0;

  const strengthIndex =
    ((bench/weight)*0.4) +
    ((squat/weight)*0.4) +
    ((press/weight)*0.2);

  const expF=experienceFactor(answers.experience);
  const envF=environmentFactor(answers.environment);
  const freqF=frequencyFactor(answers.frequency);

  const baselineMultiplier = Math.max(
    0.75,
    Math.min(1.55, 0.95 + strengthIndex*0.22 + (expF-1)*0.35)
  );

  let levelLabel="ビギナー";
  if(baselineMultiplier>=1.25) levelLabel="ハードトレーニー";
  else if(baselineMultiplier>=1.08) levelLabel="中級トレーニー";

  return {
    weight,
    experience:answers.experience,
    weeklyFrequency:Number(answers.frequency||1),
    environment:answers.environment,
    referenceLifts:{bench,squat,press},
    strengthIndex:Number(strengthIndex.toFixed(3)),
    baselineMultiplier:Number(baselineMultiplier.toFixed(3)),
    recoveryFactor:Number(freqF.toFixed(3)),
    environmentFactor:Number(envF.toFixed(3)),
    levelLabel,
    createdAt:new Date().toISOString()
  };
}

function renderQuestion(){
  const q=questions[step];
  onboardProgress.style.width=((step+1)/questions.length*100)+"%";
  backQuestion.style.visibility=step===0||q.type==="result"?"hidden":"visible";
  nextQuestion.textContent=q.type==="result"?"卵を受け取る":"次へ";

  let html=`
    <div class="question-kicker">${q.kicker}</div>
    <div class="question-title">${q.title}</div>
    <div class="question-desc">${q.desc}</div>
    <div class="answer-area">
  `;

  if(q.type==="number"){
    html+=`
      <div class="number-card">
        <div class="number-line">
          <input
            class="number-input"
            id="numberAnswer"
            type="number"
            inputmode="decimal"
            min="${q.min}"
            max="${q.max}"
            placeholder="${q.placeholder}"
            value="${answers[q.key] || ""}"
          />
          <div class="number-unit">${q.unit}</div>
        </div>
        <div class="inline-note">ざっくりで大丈夫</div>
      </div>
    `;
  }

  if(q.type==="choice"){
    html+=`<div class="choice-grid ${q.options.length===3?'one':''}">`;
    q.options.forEach(([value,label])=>{
      const active=answers[q.key]===value?"active":"";
      html+=`<button class="choice ${active}" data-value="${value}">${label}</button>`;
    });
    html+=`</div>`;
  }

  if(q.type==="result"){
    const p=calculateProfile();
    html+=`
      <div class="result-card">
        <div class="result-title">診断結果</div>
        <div class="result-row"><span>タイプ</span><strong>${p.levelLabel}</strong></div>
        <div class="result-row"><span>基準倍率</span><strong>${p.baselineMultiplier}</strong></div>
        <div class="result-row"><span>週トレ頻度</span><strong>${p.weeklyFrequency}回</strong></div>
        <div class="result-row"><span>環境</span><strong>${environmentLabel(p.environment)}</strong></div>
      </div>
      <div class="egg-receive">🥚</div>
      <div class="inline-note">この卵が、あなたの記録で育っていく。</div>
    `;
  }

  html+=`</div>`;
  questionWrap.innerHTML=html;

  if(q.type==="number"){
    const input=document.getElementById("numberAnswer");
    input.addEventListener("input",()=>{
      answers[q.key]=input.value;
      updateNextState();
    });
  }

  if(q.type==="choice"){
    questionWrap.querySelectorAll(".choice").forEach(btn=>{
      btn.addEventListener("click",()=>{
        answers[q.key]=btn.dataset.value;
        renderQuestion();
      });
    });
  }

  updateNextState();
}

function environmentLabel(v){
  if(v==="home") return "自宅";
  if(v==="gym") return "ジム";
  return "自宅＋ジム";
}

function updateNextState(){
  const q=questions[step];
  if(q.type==="result"){
    nextQuestion.disabled=false;
    return;
  }
  if(q.type==="number"){
    nextQuestion.disabled=false;
    return;
  }
  nextQuestion.disabled=!answers[q.key];
}

nextQuestion.addEventListener("click",()=>{
  const q=questions[step];

  if(q.type==="number"){
    const input=document.getElementById("numberAnswer");
    if(input) answers[q.key]=input.value;

    if(q.key==="weight"){
      const weightValue=Number(answers[q.key]);
      if(!weightValue || weightValue<30 || weightValue>200){
        showToast("体重を30〜200kgで入力してね");
        return;
      }
    }
  }

  if(q.type==="result"){
    data.profile=calculateProfile();
    data.setupComplete=true;
    saveData();
    onboardingScreen.classList.add("hidden");
    homeScreen.classList.remove("hidden");
    showToast("たまごを受け取った！");
    render();
    return;
  }

  step++;
  renderQuestion();
});

backQuestion.addEventListener("click",()=>{
  if(step>0){
    step--;
    renderQuestion();
  }
});

function startOnboardingIfNeeded(){
  if(!data.setupComplete){
    homeScreen.classList.add("hidden");
    onboardingScreen.classList.remove("hidden");
    step=0;
    renderQuestion();
  }else{
    onboardingScreen.classList.add("hidden");
    homeScreen.classList.remove("hidden");
  }
}

/* ---------- APP ---------- */
function renderDate(){
  const now=new Date();
  const days=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
  document.getElementById("dateMain").textContent=(now.getMonth()+1)+"月"+now.getDate()+"日";
  document.getElementById("weekday").textContent=days[now.getDay()];
}
function levelInfo(){
  return {level:Math.floor(data.exp/100)+1,current:data.exp%100};
}
function evolve(level){
  egg.classList.remove("cracked");
  if(level>=5){
    egg.textContent="🐣";
    petName.textContent="ムキムキひよこ";
    statusText.textContent="まだまだいけるぞ！";
    egg.classList.add("cracked");
  }else if(level>=3){
    egg.textContent="🥚";
    petName.textContent="割れかけたまご";
    statusText.textContent="中で暴れてる…";
    egg.classList.add("cracked");
  }else if(level>=2){
    egg.textContent="🥚";
    petName.textContent="元気なたまご";
    statusText.textContent="ちょっと動きたい。";
  }else{
    egg.textContent="🥚";
    petName.textContent="たまご";
    statusText.textContent="今日はどうする？";
  }
}
function renderToday(){
  const today=new Date().toDateString();
  const logs=data.history.filter(x=>new Date(x.date).toDateString()===today);
  if(logs.length===0){
    todaySummary.textContent="今日はまだトレーニングしてない";
  }else{
    const total=logs.reduce((s,x)=>s+x.reps,0);
    todaySummary.textContent="今日 "+logs.length+"種目 / 合計 "+total+"回";
  }
}
function render(){
  renderDate();
  const info=levelInfo();
  levelText.textContent="Lv."+info.level;
  expText.textContent=info.current+" / 100";
  expBar.style.width=info.current+"%";
  repsEl.textContent=reps;
  evolve(info.level);
  renderToday();
}
function openTraining(){
  homeScreen.classList.add("hidden-left");
  trainingScreen.classList.remove("hidden-right");
}
function backHome(){
  homeScreen.classList.remove("hidden-left");
  trainingScreen.classList.add("hidden-right");
}
function showToast(text){
  toast.textContent=text;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1400);
}

document.getElementById("openTraining").addEventListener("click",openTraining);
document.getElementById("backHome").addEventListener("click",backHome);

document.querySelectorAll("#menu button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll("#menu button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    selected=btn.dataset.name;
  });
});

document.getElementById("minus").addEventListener("click",()=>{
  reps=Math.max(1,reps-1);
  render();
});
document.getElementById("plus").addEventListener("click",()=>{
  reps++;
  render();
});

document.getElementById("save").addEventListener("click",()=>{
  const userMultiplier=(data.profile && data.profile.baselineMultiplier) ? data.profile.baselineMultiplier : 1;
  const gained=Math.max(5,Math.round(reps*1.5*userMultiplier));

  data.exp+=gained;
  data.history.unshift({
    name:selected,
    reps:reps,
    exp:gained,
    date:new Date().toISOString()
  });
  data.history=data.history.slice(0,50);
  saveData();

  showToast(selected+" "+reps+"回  +"+gained+"EXP");
  render();

  setTimeout(()=>{
    backHome();
    egg.classList.add("pop");
    setTimeout(()=>egg.classList.remove("pop"),220);
  },450);
});

startOnboardingIfNeeded();
render();
</script>
</body>
</html>
